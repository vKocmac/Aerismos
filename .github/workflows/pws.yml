# Τοπικοί σταθμοί Weather Underground → pws.json
#
# ΓΙΑΤΙ: το Open-Meteo δεν είναι μέτρηση αλλά μοντέλο σε κελί ~7 km, που δεν λύνει τη
# θαλάσσια αύρα. Οι σταθμοί της γειτονιάς μετράνε πραγματικά — αλλά το api.weather.com
# θέλει κλειδί που δίνεται μόνο σε ιδιοκτήτες PWS (επιβεβαιωμένο: 401 Missing apiKey).
#
# ΠΩΣ: φορτώνουμε τη δημόσια σελίδα με headless browser και **υποκλέπτουμε την απάντηση
# του API που κάνει η ίδια η σελίδα**. Δεν χρησιμοποιούμε δικό μας ή κλεμμένο κλειδί.
# Αυτό είναι πολύ σταθερότερο από CSS selectors: το JSON schema αλλάζει σπάνια.
#
# ΕΥΘΡΑΥΣΤΟ ΕΞ ΟΡΙΣΜΟΥ: αν αλλάξει η σελίδα τους, σπάει. Γι' αυτό η σελίδα έχει
# επιλογέα πηγής και υποχωρεί μόνη της στο μοντέλο όταν το pws.json λείπει ή παλιώσει.
#
# ΠΟΙΟΣ ΤΟ ΞΕΚΙΝΑ — τρεις δρόμοι, και μπορούν να συμπέσουν:
#   1. Cloudflare Worker, κάθε 15΄ (workflow_dispatch) — ο ΚΥΡΙΟΣ.
#   2. Το schedule παρακάτω — ΕΦΕΔΡΕΙΑ. Σε δωρεάν δημόσιο repo το GitHub παραδίδει 6-8
#      από τις 96 εκτελέσεις την ημέρα (μετρημένο 29/08-12/09/2026). Κράτησε όμως
#      μετρήσεις τη νύχτα 12→13/09 που σώπασε η Cloudflare.
#   3. Η ίδια η σελίδα (κουμπί «Ανανέωση» ή αυτόματα όταν ανοίγει με παλιά δεδομένα).

name: PWS τοπικοί σταθμοί

on:
  schedule:
    # ΟΧΙ '*/15': πέφτει στα :00/:15/:30/:45, τις ώρες αιχμής του GitHub, όπου τα
    # scheduled runs καθυστερούν ή χάνονται. Μετατοπισμένα λεπτά, ίδια συχνότητα.
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pws
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Η ΤΕΛΕΥΤΑΙΑ έκδοση του main τη στιγμή που ξεκινά το job — ΟΧΙ το commit που το
          # πυροδότησε. 13/09/2026: run του Worker (06:16 UTC) και εφεδρικό cron (06:17)
          # πυροδοτήθηκαν από το ίδιο commit. Το concurrency τα έβαλε σωστά σε σειρά, αλλά
          # το δεύτερο έκανε checkout την παλιά εικόνα και το push του απορρίφθηκε.
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Εγκατάσταση Playwright
        run: npm i -D playwright@1.47.0 && npx playwright install --with-deps chromium

      - name: Συλλογή σταθμών
        run: node scrape_pws.js

      - name: Commit αν άλλαξε
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain pws.json)" ]; then
            echo "Καμία αλλαγή."
            exit 0
          fi
          git add pws.json
          git commit -m "PWS $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Αν στο μεταξύ ανέβηκε άλλο commit (deploy ή άλλο run στα ίδια δευτερόλεπτα),
          # ενσωμάτωσέ το και ξαναδοκίμασε. Στο rebase το «-X theirs» κρατά το ΔΙΚΟ ΜΑΣ
          # pws.json — τη νεότερη σάρωση. Όλα τα άλλα αρχεία έρχονται από το main, οπότε
          # ένα run δεν μπορεί ποτέ να αναιρέσει deploy.
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Απορρίφθηκε το push (προσπάθεια $i) — ενσωμάτωση του main και ξανά."
            sleep $((i * 5))
            if ! git pull --rebase -X theirs origin main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
